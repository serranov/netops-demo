# =====================================================================
#  PLAN DE DESPLIEGUE POR ETAPAS - onboarding de leaf3
# =====================================================================
# Cada etapa es un FRAGMENTO que scripts/promote.py fusiona en intent/leaf3.yml
# en una rama propia. Una etapa por Pull Request: cada una con su plan, su
# verificacion y su rollback. El contenido replica la configuracion de servicio
# del startup-config del laboratorio (srl-telemetry-lab/configs/fabric/leaf3.cfg).
#
#   auto_promote: false -> la etapa la inicia una persona (make prep / make promote)
#   auto_promote: true  -> el job `promote` abre su PR automaticamente cuando la
#                          etapa anterior se ha desplegado y verificado en el nodo.
#                          El merge sigue siendo una decision humana.

node: leaf3

stages:
  - name: overlay
    order: 10
    auto_promote: false
    branch: onboarding/leaf3-10-overlay
    title: "leaf3: dia 1 - sesiones iBGP EVPN de overlay hacia los spines (RR)"
    description: >
      Conecta leaf3 al plano de control del overlay: grupo iBGP-overlay (AS 100,
      familia EVPN) y sesiones hacia spine1 (10.0.2.1) y spine2 (10.0.2.2) desde
      system0 (10.0.1.3). Prerrequisito: underlay eBGP establecido (dia 0).
      Verificacion: ambas sesiones `established` con AFI evpn.
    intent:
      bgp:
        groups:
          - name: iBGP-overlay
            peer_as: 100
            local_as: 100
            export_policy: [all]
            import_policy: [all]
            afi_safi:
              ipv4-unicast: disable
              evpn: enable
            timers:
              minimum_advertisement_interval: 1
              connect_retry: 1
            neighbors:
              - peer_address: 10.0.2.1
                local_address: 10.0.1.3
                description: "overlay EVPN a spine1 (route reflector)"
              - peer_address: 10.0.2.2
                local_address: 10.0.1.3
                description: "overlay EVPN a spine2 (route reflector)"

  - name: service
    order: 20
    auto_promote: true
    branch: onboarding/leaf3-20-service-vrf1
    title: "leaf3: dia 2 - servicio vrf-1 (mac-vrf, VNI 1) para el servidor client3"
    description: >
      Adhiere leaf3 al dominio L2 EVPN del tenant vrf-1 (EVI 1, VNI 1, RT 100:1):
      subinterfaz de acceso ethernet-1/1.0 (bridged), vxlan-interface vxlan1.1 y
      mac-vrf con bgp-evpn. Prerrequisito: overlay del dia 1 `established`.
      Verificacion: vrf-1 oper-state up y trafico de client3 en leaf3 e1-1.
    intent:
      services:
        - name: vrf-1
          type: mac-vrf
          evi: 1
          vni: 1
          route_target: target:100:1
          ecmp: 2
          vxlan:
            tunnel_interface: vxlan1
            index: 1
          access_interfaces:
            - interface: ethernet-1/1
              index: 0
