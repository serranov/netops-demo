# === PARCHE NETOPS DEMO ===
# Sustituye a configs/gnmic/gnmic-config.yml del srl-telemetry-lab.
# Cambios respecto al original (marcados con "# NETOPS"):
#   1. Nueva suscripcion `srl-bgp-neighbors`: estado de sesion POR VECINO.
#   2. Nuevo procesador `bgp-state-to-int`: established -> 1, resto -> 0.
#   3. El procesador se aplica en la salida Prometheus.
# Resultado: metrica `network_instance_protocols_bgp_neighbor_session_state`
#   con labels source, network_instance_name, neighbor_peer_address (valor 1/0).

username: admin
timeout: 10s

common_srl_subscriptions: &common_srl_subs
  skip-verify: true
  insecure: false
  password: NokiaSrl1!
  subscriptions:
    - srl-if-stats
    - srl-bgp
    - srl-bgp-neighbors        # NETOPS
    - srl-system-performance
    - srl-routes
    - srl-bridge
    - srl-apps
    - srl-net-instance

targets:
  leaf1: *common_srl_subs
  leaf2: *common_srl_subs
  leaf3: *common_srl_subs
  spine1: *common_srl_subs
  spine2: *common_srl_subs

subscriptions:
  srl-system-performance:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /platform/control[slot=*]/cpu[index=all]/total
      - /platform/control[slot=*]/memory
  srl-if-stats:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /interface[name=ethernet-1/*]/oper-state
      - /interface[name=ethernet-1/*]/statistics
      - /interface[name=ethernet-1/*]/traffic-rate
  srl-routes:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /network-instance[name=*]/route-table/ipv4-unicast/statistics/
      - /network-instance[name=*]/route-table/ipv6-unicast/statistics/
  srl-bgp:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /network-instance[name=*]/protocols/bgp/statistics
  # NETOPS: estado de sesion por vecino BGP (lo que veremos converger en Grafana)
  srl-bgp-neighbors:
    mode: stream
    stream-mode: sample
    sample-interval: 2s
    paths:
      - /network-instance[name=default]/protocols/bgp/neighbor[peer-address=*]/session-state
  srl-bridge:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /network-instance[name=*]/bridge-table/statistics/
  srl-apps:
    paths:
      - /system/app-management/application[name=*]
    mode: stream
    stream-mode: sample
    sample-interval: 5s
  srl-net-instance:
    paths:
      - /network-instance[name=*]/oper-state
    mode: stream
    stream-mode: sample
    sample-interval: 5s

outputs:
  prom-output:
    type: prometheus
    listen: :9273
    event-processors:
      - trim-prefixes
      - rename-srl-interface
      - bgp-state-to-int       # NETOPS (antes de oper-state-to-int)
      - oper-state-to-int

processors:
  trim-prefixes:
    event-strings:
      value-names:
        - "^/state/.*"
      transforms:
        - trim-prefix:
            apply-on: "name"
            prefix: "/state/"

  # NETOPS: convierte session-state a numerico para Prometheus
  bgp-state-to-int:
    event-strings:
      value-names:
        - ".*session-state$"
      transforms:
        - replace:
            apply-on: "value"
            old: "^established$"
            new: "1"
        - replace:
            apply-on: "value"
            old: "^(idle|connect|active|opensent|openconfirm)$"
            new: "0"

  oper-state-to-int:
    event-strings:
      value-names:
        - ".*"
      transforms:
        - replace:
            apply-on: "value"
            old: "up"
            new: "1"
        - replace:
            apply-on: "value"
            old: "down"
            new: "0"
  rename-srl-interface:
    event-strings:
      tag-names:
        - "^interface_name"
      transforms:
        - replace:
            apply-on: "value"
            old: "ethernet-(\\d+)/(\\d+)"
            new: "e$1-$2"
